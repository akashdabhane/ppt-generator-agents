services:
  postgres:
    image: postgres:16-alpine
    container_name: ppt_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ppt_generator_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ppt_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ppt_backend
    ports:
      - "8000:8000"
    # API keys, LLM/embedding provider, SECRET_KEY etc. come from backend/.env (template: backend/.env.example)
    env_file: ./backend/.env
    environment: &container_env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ppt_generator_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CORS_ORIGINS: http://localhost:3000
      STORAGE_DIR: /app/storage
    volumes:
      # Shared with the worker: it writes uploads/decks that the API serves
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ppt_worker
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    env_file: ./backend/.env
    environment: *container_env
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Inlined into the browser bundle at build time: the URL the *browser* uses to reach the API
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: ppt_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  storage_data:
